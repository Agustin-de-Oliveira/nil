[package]
name = "nil-notes"
version = "0.1.0"
edition = "2021"

[dependencies]
nil-core = { path = "../nil-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["custom-protocol"] }

[build-dependencies]
tauri-build = "2"
